<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Authorization - InnoGen AI Pro</title>
  <style>
    body {
      background: #0d0d18;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(124, 58, 237, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h3>Connecting to GitHub...</h3>
  <p>Please wait while we complete the authorization.</p>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');
      const errorDescription = params.get('error_description');

      if (window.opener) {
        window.opener.postMessage({
          type: 'GITHUB_AUTH_RESPONSE',
          code: code,
          error: error || (errorDescription ? errorDescription : null)
        }, '*');
        setTimeout(() => window.close(), 500);
      } else {
        document.body.innerHTML = '<h3>Authorization processed. You may return to InnoGen AI Pro.</h3>';
      }
    })();
  </script>
</body>
</html>
